name: VersionRAG Enterprise CI & Breaking-Change Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests-and-ast-audit:
    name: Backend Pytest Suite & AST CLI Auditor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Suite (Unit + API E2E)
        env:
          PYTHONPATH: ./backend
        run: |
          pytest backend/tests/ -v

      - name: Run VersionRAG CLI Breaking-Change Auditor Smoke Check
        working-directory: ./backend
        run: |
          python -m app.cli_audit \
            --code "const tracker = new assert.CallTracker(); const fn = tracker.calls(1); assert.deepEqual(a, b);" \
            --from v14.0.0 \
            --to v16.0.0 \
            --no-fail

  frontend-typecheck-and-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: ./frontend
        run: |
          npm install
          npm run build
